name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        env:
          TZ: Europe/Berlin
      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          CARD="$(node -e "import('./range-graph-card.js').then(m => console.log(m.VERSION))")"
          test "$TAG" = "$PKG" && test "$TAG" = "$CARD" || { echo "Tag $TAG, package.json $PKG, card $CARD differ"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          files: range-graph-card.js
